# The .deb and .rpm of a release, from the musl tarballs it already holds
# (tools/linux-packages.sh runs nfpm over this file once for each package;
# the NFPM_ variables are its). The binaries are static, so a package
# depends on nothing and installs on any distribution of its architecture.
name: fennecdb
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
# 0.2.0-rc1 becomes 0.2.0~rc1, which sorts before 0.2.0 as a pre-release must.
version_schema: semver
release: "1"
section: database
priority: optional
maintainer: fennecdb <noreply@fenecdb.com>
vendor: fennecdb
homepage: https://fenecdb.com
license: Apache-2.0
description: |
  Embedded database with its own query language, FennecQL.
  fennec is the shell and fennec-server the HTTP server: REST routes, FennecQL
  over POST /query, subscriptions, replication and change data capture.
  A document store with full-text, vector, geo and ordered indexes in a
  single file.

contents:
  # expand: the binaries' directory is the script's.
  - src: ${NFPM_BIN}/fennec
    dst: /usr/bin/fennec
    expand: true
    file_info:
      mode: 0755
  - src: ${NFPM_BIN}/fennec-server
    dst: /usr/bin/fennec-server
    expand: true
    file_info:
      mode: 0755
  # Where each distribution looks for a licence: Debian's copyright file, and
  # the %license of an rpm.
  - src: LICENSE
    dst: /usr/share/doc/fennecdb/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/fennecdb/LICENSE
    type: license
    packager: rpm
    file_info:
      mode: 0644
